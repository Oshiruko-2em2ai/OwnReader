name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Check Gradle Wrapper files
      # ------------------------------------------------------------
      - name: Check Gradle Wrapper files
        run: |
          echo "=== Repository root ==="
          ls -la

          echo ""
          echo "=== gradle/wrapper directory ==="
          ls -la gradle/wrapper || true

          echo ""
          echo "=== Gradle Wrapper files ==="
          find . -name "gradle-wrapper*" -print

          echo ""
          echo "=== Check gradle-wrapper.jar ==="
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle/wrapper/gradle-wrapper.jar was not found."
            echo "Please commit gradle-wrapper.jar to the repository."
            exit 1
          fi

          echo "gradle-wrapper.jar found."

      # ------------------------------------------------------------
      # Java
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------------
      # Gradle Wrapper permission
      # ------------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # Show Gradle version
      # ------------------------------------------------------------
      - name: Check Gradle version
        run: ./gradlew --version

      # ------------------------------------------------------------
      # Build APK
      # ------------------------------------------------------------
      - name: Clean and build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug --stacktrace 2>&1 | tee build-output.log

      # ------------------------------------------------------------
      # Check generated APK
      # ------------------------------------------------------------
      - name: Check generated APK
        if: success()
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

          echo ""
          echo "=== app/build/outputs ==="
          find app/build/outputs -type f -print || true

          echo ""
          echo "=== Check debug APK ==="
          if ! find app/build/outputs/apk/debug -type f -name "*.apk" -print -quit | grep -q .; then
            echo "ERROR: Debug APK was not found."
            exit 1
          fi

          echo "Debug APK found."

      # ------------------------------------------------------------
      # Upload build log when build failed
      # ------------------------------------------------------------
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          if-no-files-found: ignore

      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownreader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
