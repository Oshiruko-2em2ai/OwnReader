name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Gradle Wrapper files
        shell: bash
        run: |
          echo "=== Current directory ==="
          pwd

          echo ""
          echo "=== Repository root ==="
          ls -la

          echo ""
          echo "=== gradle/wrapper ==="
          ls -lah gradle/wrapper

          echo ""
          echo "=== gradle-wrapper.jar information ==="
          file gradle/wrapper/gradle-wrapper.jar

          echo ""
          echo "=== gradle-wrapper.jar size ==="
          wc -c gradle/wrapper/gradle-wrapper.jar

          echo ""
          echo "=== Check GradleWrapperMain ==="
          jar tf gradle/wrapper/gradle-wrapper.jar | grep "GradleWrapperMain" || {
            echo ""
            echo "ERROR: GradleWrapperMain was NOT found inside gradle-wrapper.jar"
            exit 1
          }

          echo ""
          echo "GradleWrapperMain found."
      # ------------------------------------------------------------
      # Java
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------------
      # Gradle Wrapper permission
      # ------------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # Show Gradle version
      # ------------------------------------------------------------
      - name: Check Gradle version
        run: ./gradlew --version

      # ------------------------------------------------------------
      # Build APK
      # ------------------------------------------------------------
      - name: Clean and build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug --stacktrace 2>&1 | tee build-output.log

      # ------------------------------------------------------------
      # Check generated APK
      # ------------------------------------------------------------
      - name: Check generated APK
        if: success()
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

          echo ""
          echo "=== app/build/outputs ==="
          find app/build/outputs -type f -print || true

          echo ""
          echo "=== Check debug APK ==="
          if ! find app/build/outputs/apk/debug -type f -name "*.apk" -print -quit | grep -q .; then
            echo "ERROR: Debug APK was not found."
            exit 1
          fi

          echo "Debug APK found."

      # ------------------------------------------------------------
      # Upload build log when build failed
      # ------------------------------------------------------------
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          if-no-files-found: ignore

      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownreader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
